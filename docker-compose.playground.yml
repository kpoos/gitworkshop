services:
  git-playground:
    build:
      context: ./playground
    ports:
      - "127.0.0.1:7681:7681"
    working_dir: /workspace
    volumes:
      - git-playground-data:/workspace
    init: true
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - SETGID
      - SETUID

volumes:
  git-playground-data:
